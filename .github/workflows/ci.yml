name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon clean check jar
      - run: jdeps --multi-release 21 --ignore-missing-deps build/libs/burp-history-rest-api-1.4.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: burp-history-rest-api-1.4.1
          path: build/libs/burp-history-rest-api-1.4.1.jar
